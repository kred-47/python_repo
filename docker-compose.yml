services:
  # Классический быстрый сервис (TF-IDF)
  classic_api:
    build: .
    container_name: sentiment_classic
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  # Умный сервис (RuModernBERT)
  bert_api:
    build:
      context: .
      dockerfile: bert_service/Dockerfile
    container_name: sentiment_bert
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models
    restart: unless-stopped